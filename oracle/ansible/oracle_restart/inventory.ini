# =============================================================================
# Example inventory for Oracle 19c Standalone install
#
# Usage: ansible-playbook -i inventory.ini phase1_playbook.yml
#        ansible-playbook -i inventory.ini phase2_playbook.yml
# =============================================================================
[ora_nodes]
oracle-host1 ansible_host=10.0.0.10
# oracle-host2 ansible_host=10.0.0.11   # add for multi-node / RAC

[ora_nodes:vars]
ansible_user=vagrant         # or your deployment user
ansible_become=yes
ansible_become_method=sudo
ansible_python_interpreter=/usr/bin/python3
