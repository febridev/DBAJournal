---
# =============================================================================
# Oracle 19c Standalone (Oracle Restart / SIHA) - Phase 2: Grid Infrastructure
# Pure Ansible IaC - no standalone bash automation scripts
# Usage (from Mac control node):
#   ansible-playbook -i inventory_ssh.ini phase2_playbook.yml
# Usage (on target VM, localhost):
#   ansible-playbook -i /tmp/inventory_local.ini phase2_playbook.yml
# =============================================================================
- name: Oracle 19c Standalone - Phase 2 Grid Infrastructure Install
  hosts: ora_nodes
  become: true
  vars:
    grid_home: /u01/19c/grid_home
    grid_base: /u01/19c/grid_base
    inventory_loc: /u01/app/oraInventory
    asm_user: grid
    asm_group: oinstall
    asm_admin_group: asmadmin
    # ASM disk mapping: sdb=OCR, sdc=DATA, sdd=FRA
    asm_disks:
      - { dev: sdb, role: ocr }
      - { dev: sdc, role: data }
      - { dev: sdd, role: fra }
    ru_patch_zip: /tmp/p39467003_190000_Linux-x86-64.zip
    ru_patch_dir: /tmp/gridpatch
    ru_patch_id: "39467003"
    opatch_zip: /tmp/p6880880_190000_Linux-x86-64.zip
    asm_sys_password: "Welcome123#"
    asm_monitor_password: "Asm#Monitor123"

  tasks:
    # ------------------------------------------------------------------
    # SECTION 0 - Resource limits for grid user (preinstall rpm only covers oracle)
    # ------------------------------------------------------------------
    - name: "0.1 Configure /etc/security/limits for grid user"
      copy:
        dest: /etc/security/limits.d/oracle-grid-preinstall-19c.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          grid   soft    nofile  65536
          grid   hard    nofile  65536
          grid   soft    nproc   16384
          grid   hard    nproc   16384
          grid   soft    stack   10240
          grid   hard    stack   32768
          grid   soft    memlock 134217728
          grid   hard    memlock 134217728

    # ------------------------------------------------------------------
    # SECTION 1 - ASM Storage: header wipe + UDEV rules by ID_SCSI_SERIAL
    # ------------------------------------------------------------------
    - name: "1.0 Detect existing ASM signatures (safety guard - never wipe live ASMDISKs)"
      shell: "blkid -o value -s TYPE /dev/{{ item.dev }} | grep -q 'Oracle ASMDISK'"
      loop: "{{ asm_disks }}"
      loop_control:
        label: "/dev/{{ item.dev }}"
      register: asm_sig_check
      failed_when: false
      changed_when: false

    - name: "1.1 Wipe first 100MB of raw ASM disk headers"
      shell: |
        dd if=/dev/zero of=/dev/{{ item.item.dev }} bs=1M count=100 conv=fsync status=none
        touch /etc/asm_disk_wiped_{{ item.item.dev }}
      loop: "{{ asm_sig_check.results }}"
      loop_control:
        label: "/dev/{{ item.item.dev }} (sig={{ 'ASMDISK' if item.rc == 0 else 'none' }})"
      args:
        creates: /etc/asm_disk_wiped_{{ item.item.dev }}
      when: item.rc != 0   # skip dd if disk already carries an ASM signature

    - name: "1.2 Collect real ID_SCSI_SERIAL for each ASM disk"
      shell: "udevadm info --query=property --name=/dev/{{ item.dev }} | awk -F= '/^ID_SCSI_SERIAL=/{print $2}'"
      loop: "{{ asm_disks }}"
      loop_control:
        label: "/dev/{{ item.dev }}"
      register: asm_serial_raw
      changed_when: false

    - name: "1.3 Build udev rule facts"
      set_fact:
        asm_rules: >-
          {{ asm_rules | default([])
             + [ { 'dev': item.item.dev,
                   'role': item.item.role,
                   'serial': item.stdout | trim } ] }}
      loop: "{{ asm_serial_raw.results }}"
      loop_control:
        label: "{{ item.item.dev }} -> {{ item.stdout | trim }}"

    - name: "1.4 Write UDEV rules file /etc/udev/rules.d/99-oracle-asm.rules"
      copy:
        dest: /etc/udev/rules.d/99-oracle-asm.rules
        owner: root
        group: root
        mode: '0644'
        content: |
          # Oracle ASM disk rules - generated by Ansible (Phase 2)
          {% for r in asm_rules %}
          # {{ r.role | upper }} ({{ '/dev/' + r.dev }}) serial={{ r.serial }}
          KERNEL=="sd*", ENV{ID_SCSI_SERIAL}=="{{ r.serial }}", SYMLINK+="oracleasm/asm-{{ r.role }}", OWNER="{{ asm_user }}", GROUP="{{ asm_admin_group }}", MODE="0660"
          {% endfor %}

    - name: "1.5 Reload udev rules and trigger"
      shell: udevadm control --reload-rules && udevadm trigger --action=add
      changed_when: true

    - name: "1.6 Verify ASM symlinks exist with grid:asmadmin ownership"
      shell: "ls -lL /dev/oracleasm/asm-{{ item.role }}"
      loop: "{{ asm_disks }}"
      loop_control:
        label: "asm-{{ item.role }}"
      register: asm_link_check
      failed_when: "'grid' not in asm_link_check.stdout or 'asmadmin' not in asm_link_check.stdout"
      changed_when: false

    # ------------------------------------------------------------------
    # SECTION 2 - OPatch upgrade + RU patch staging (as grid user)
    # ------------------------------------------------------------------
    - name: "2.0 Check if OPatch was already backed up"
      stat:
        path: "{{ grid_home }}/OPatch_bak"
      register: opatch_bak

    - name: "2.1 Backup existing OPatch dir as grid user"
      command: "mv {{ grid_home }}/OPatch {{ grid_home }}/OPatch_bak"
      become_user: "{{ asm_user }}"
      when: not opatch_bak.stat.exists

    - name: "2.2 Extract new OPatch into GRID_HOME as grid user"
      unarchive:
        src: "{{ opatch_zip }}"
        dest: "{{ grid_home }}"
        remote_src: true
        owner: "{{ asm_user }}"
        group: "{{ asm_group }}"
      become_user: "{{ asm_user }}"
      when: not opatch_bak.stat.exists

    - name: "2.3 Create RU patch staging dir as grid user"
      file:
        path: "{{ ru_patch_dir }}"
        state: directory
        owner: "{{ asm_user }}"
        group: "{{ asm_group }}"
        mode: '0775'

    - name: "2.4 Extract RU patch zip as grid user"
      unarchive:
        src: "{{ ru_patch_zip }}"
        dest: "{{ ru_patch_dir }}"
        remote_src: true
        owner: "{{ asm_user }}"
        group: "{{ asm_group }}"
      become_user: "{{ asm_user }}"
      args:
        creates: "{{ ru_patch_dir }}/{{ ru_patch_id }}"

    - name: "2.5 Check if RU is already applied in GRID_HOME (patch_storage)"
      shell: "grep -qE '({{ ru_patch_id }}|39526364)' {{ grid_home }}/.patch_storage/interim_inventory.txt 2>/dev/null"
      become_user: "{{ asm_user }}"
      register: ru_applied_check
      failed_when: false
      changed_when: false

    # ------------------------------------------------------------------
    # SECTION 3 - gridsetup.rsp generation (silent mode)
    # NOTE: keys must match the 19.0 response-file XSD schema exactly:
    #   - redundancy is UPPERCASE EXTERNAL
    #   - no oracle.install.asm.configureCAD / OSGROUP / configureAFS keys
    #   - GIMR flag is oracle.install.asm.configureGIMRDataDG
    #   - AU key is oracle.install.asm.diskGroup.AU.size
    # ------------------------------------------------------------------
    - name: "3.0 Ensure oraInventory parent dirs exist (owned by grid)"
      file:
        path: "{{ item }}"
        state: directory
        owner: "{{ asm_user }}"
        group: "{{ asm_group }}"
        mode: '0775'
      loop:
        - /u01/app
        - "{{ inventory_loc }}"

    - name: "3.1 Generate gridsetup.rsp for silent install (OCR diskgroup via ASM)"
      copy:
        dest: /tmp/gridsetup.rsp
        owner: "{{ asm_user }}"
        group: "{{ asm_group }}"
        mode: '0640'
        content: |
          oracle.install.responseFileVersion=/oracle/install/rspfmt_crsinstall_response_schema_v19.0.0
          INVENTORY_LOCATION={{ inventory_loc }}
          oracle.install.option=HA_CONFIG
          ORACLE_BASE={{ grid_base }}
          oracle.install.asm.OSDBA=asmdba
          oracle.install.asm.OSOPER=asmoper
          oracle.install.asm.OSASM={{ asm_admin_group }}
          oracle.install.asm.configureGIMRDataDG=false
          oracle.install.asm.SYSASMPassword={{ asm_sys_password }}
          oracle.install.asm.diskGroup.name=OCR
          oracle.install.asm.diskGroup.redundancy=EXTERNAL
          oracle.install.asm.diskGroup.AUSize=4
          oracle.install.asm.diskGroup.disks=/dev/oracleasm/asm-ocr
          oracle.install.asm.diskGroup.diskDiscoveryString=/dev/oracleasm/*
          oracle.install.asm.monitorPassword={{ asm_monitor_password }}

    # ------------------------------------------------------------------
    # SECTION 4 - gridSetup.sh silent install
    # (-applyRU only when RU not yet in the home; rc=6 = install done but
    #  root scripts pending -> tolerated, handled in Section 5)
    # ------------------------------------------------------------------
    - name: "4.0 Guard: check if GI is fully configured (olr.loc)"
      stat:
        path: /etc/oracle/olr.loc
      register: olr_file

    - name: "4.0b Guard: check if software install already completed (orainstRoot.sh present)"
      stat:
        path: "{{ inventory_loc }}/orainstRoot.sh"
      register: swinstall_marker

    - name: "4.1a Run gridSetup.sh WITH -applyRU -silent (long-running)"
      shell: |
        source /home/{{ asm_user }}/.grid19c_env
        export CV_ASSUME_DISTID=OEL8
        cd {{ grid_home }}
        ./gridSetup.sh -applyRU {{ ru_patch_dir }}/{{ ru_patch_id }} -silent -responseFile /tmp/gridsetup.rsp -ignorePrereq -waitForCompletion
      become_user: "{{ asm_user }}"
      register: gridsetup_out
      failed_when: gridsetup_out.rc not in [0, 6]
      changed_when: true
      when:
        - not olr_file.stat.exists
        - not swinstall_marker.stat.exists
        - ru_applied_check.rc != 0
      async: 3600
      poll: 30

    - name: "4.1b Run gridSetup.sh -silent (RU already in home, long-running)"
      shell: |
        source /home/{{ asm_user }}/.grid19c_env
        export CV_ASSUME_DISTID=OEL8
        cd {{ grid_home }}
        ./gridSetup.sh -silent -responseFile /tmp/gridsetup.rsp -ignorePrereq -waitForCompletion
      become_user: "{{ asm_user }}"
      register: gridsetup_out_noru
      failed_when: gridsetup_out_noru.rc not in [0, 6]
      changed_when: true
      when:
        - not olr_file.stat.exists
        - not swinstall_marker.stat.exists
        - ru_applied_check.rc == 0
      async: 3600
      poll: 30

    - name: "4.2 Show last lines of gridSetup output"
      debug:
        msg: "{{ (gridsetup_out.stdout_lines if gridsetup_out.stdout_lines is defined else (gridsetup_out_noru.stdout_lines if gridsetup_out_noru.stdout_lines is defined else ['(skipped)']))[-15:] }}"

    # ------------------------------------------------------------------
    # SECTION 5 - Root scripts (as root via become)
    # ------------------------------------------------------------------
    - name: "5.1 Run orainstRoot.sh (idempotent, re-run safe)"
      shell: "printf 'y\\n' | {{ inventory_loc }}/orainstRoot.sh"
      register: orainst_out
      changed_when: "'execution of the script is complete' in orainst_out.stdout"

    - name: "5.2 Check if root.sh already run"
      stat:
        path: "{{ grid_home }}/crs/install/root.sh.done"
      register: rootsh_done_marker

    - name: "5.3 Run root.sh (configures + starts Oracle Restart stack, long-running)"
      shell: "printf 'y\\n' | {{ grid_home }}/root.sh | tee {{ grid_home }}/crs/install/last_root_output.log && touch {{ grid_home }}/crs/install/root.sh.done"
      register: rootsh_out
      when: not rootsh_done_marker.stat.exists
      async: 1800
      poll: 20

    - name: "5.4 Show last lines of root.sh output"
      debug:
        msg: "{{ rootsh_out.stdout_lines[-15:] | default(['(task skipped)']) }}"
      when: rootsh_out.stdout is defined

    # ------------------------------------------------------------------
    # SECTION 6 - Wait for CRS after root.sh, run deferred config tools
    # (creates OCR diskgroup + OCR/Voting files), then DATA & FRA DGs
    # ------------------------------------------------------------------
    - name: "6.0 Wait for Oracle Restart (OHASD) to be up after root.sh"
      shell: "{{ grid_home }}/bin/crsctl check has"
      register: crs_up_check
      until: crs_up_check.rc == 0
      retries: 80
      delay: 15
      changed_when: false

    - name: "6.0a Check if OCR diskgroup already configured"
      shell: |
        source /home/{{ asm_user }}/.grid19c_env
        asmcmd lsdg | grep -qw OCR
      become_user: "{{ asm_user }}"
      register: ocr_dg_check
      failed_when: false
      changed_when: false

    - name: "6.0b Run gridSetup.sh -executeConfigTools -silent (creates OCR DG + OCR/Voting, long-running)"
      shell: |
        source /home/{{ asm_user }}/.grid19c_env
        cd {{ grid_home }}
        ./gridSetup.sh -executeConfigTools -responseFile /tmp/gridsetup.rsp -silent
      become_user: "{{ asm_user }}"
      register: cfgtools_out
      failed_when: cfgtools_out.rc != 0
      changed_when: true
      when: ocr_dg_check.rc != 0
      async: 2400
      poll: 30

    - name: "6.0c Show last lines of executeConfigTools output"
      debug:
        msg: "{{ cfgtools_out.stdout_lines[-20:] | default(['(skipped - OCR DG already configured)']) }}"
      when: cfgtools_out.stdout_lines is defined

    - name: "6.1 List current diskgroups"
      shell: |
        source /home/{{ asm_user }}/.grid19c_env
        asmcmd lsdg
      become_user: "{{ asm_user }}"
      register: dg_list
      changed_when: false

    - name: "6.2 Create DATA diskgroup (external redundancy)"
      shell: |
        source /home/{{ asm_user }}/.grid19c_env
        echo "CREATE DISKGROUP DATA EXTERNAL REDUNDANCY DISK '/dev/oracleasm/asm-data' ATTRIBUTE 'au_size'='4M';" | sqlplus -S / AS SYSASM
      become_user: "{{ asm_user }}"
      register: dg_data
      failed_when: "'Diskgroup created' not in dg_data.stdout and 'ORA-' not in dg_data.stdout"
      when: "'DATA' not in dg_list.stdout"

    - name: "6.3 Create FRA diskgroup (external redundancy)"
      shell: |
        source /home/{{ asm_user }}/.grid19c_env
        echo "CREATE DISKGROUP FRA EXTERNAL REDUNDANCY DISK '/dev/oracleasm/asm-fra' ATTRIBUTE 'au_size'='4M';" | sqlplus -S / AS SYSASM
      become_user: "{{ asm_user }}"
      register: dg_fra
      failed_when: "'Diskgroup created' not in dg_fra.stdout and 'ORA-' not in dg_fra.stdout"
      when: "'FRA' not in dg_list.stdout"

    # ------------------------------------------------------------------
    # SECTION 7 - Verification
    # ------------------------------------------------------------------
    - name: "7.1 CRS resource state"
      shell: "{{ grid_home }}/bin/crsctl stat res -t"
      register: crs_state
      changed_when: false

    - name: "7.2 Verify all 3 diskgroups ONLINE (OCR, DATA, FRA)"
      shell: |
        source /home/{{ asm_user }}/.grid19c_env
        asmcmd lsdg
      become_user: "{{ asm_user }}"
      register: dg_final
      changed_when: false
      failed_when: >-
        'OCR' not in dg_final.stdout or
        'DATA' not in dg_final.stdout or
        'FRA' not in dg_final.stdout

    - name: "7.3 GI OPatch patch level (RU applied)"
      shell: |
        source /home/{{ asm_user }}/.grid19c_env
        {{ grid_home }}/OPatch/opatch lspatches
      become_user: "{{ asm_user }}"
      register: gi_version
      changed_when: false

    - name: "7.4 Final verification summary"
      debug:
        msg:
          - "=== CRS STATUS ==="
          - "{{ crs_state.stdout_lines }}"
          - "=== DISK GROUPS ==="
          - "{{ dg_final.stdout_lines }}"
          - "=== OPATCH LEVEL ==="
          - "{{ gi_version.stdout_lines }}"
